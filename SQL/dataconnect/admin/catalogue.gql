# IAM-only catalogue API. Runtime callables validate current Auth and strict inputs.
query ReadSqlCatalogue @auth(level: NO_ACCESS) {
  branches(limit: 1001, orderBy: [{id: ASC}]) { id legacyId code name address timezone active updatedAt }
  departments(limit: 1001, orderBy: [{id: ASC}]) { id legacyId branchId code name description active publicBookingEnabled sortOrder updatedAt }
  doctors(limit: 1001, orderBy: [{id: ASC}]) { id legacyId branchId name qualification registrationNumber active bookingEnabled updatedAt }
  doctorDepartments(limit: 12001, orderBy: [{doctorId: ASC}, {departmentId: ASC}]) { doctorId departmentId sortOrder }
}
query GetCatalogueReceipt($actorUid: String!, $requestId: UUID!) @auth(level: NO_ACCESS) {
  operationReceipt(key: {actorUid: $actorUid, requestId: $requestId}) { operation }
}

mutation CreateCatalogueBranch(
  $actorUid: String!, $requestId: UUID!, $operation: String!, $id: UUID!, $legacyId: String!,
  $name: String!, $active: Boolean!, $code: String!, $address: String!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    operationReceipt(key: {actorUid: $actorUid, requestId: $requestId})
      @check(expr: "this == null", message: "CATALOGUE_REQUEST_APPLIED") { operation }
  }
  branch_insert(
    data: {id: $id, legacyId: $legacyId, name: $name, active: $active, code: $code, address: $address, timezone: "Asia/Kolkata", updatedAt_expr: "request.time"}
  )

  auditLog_insert(data: {actorUid: $actorUid, actorRole: "admin", action: "booking_catalog_branch_saved", resourceType: "catalogue_branch", resourceId: $legacyId})
  operationReceipt_insert(data: {actorUid: $actorUid, requestId: $requestId, operation: $operation})
}

mutation UpdateCatalogueBranch(
  $actorUid: String!, $requestId: UUID!, $operation: String!, $id: UUID!, $legacyId: String!,
  $expectedUpdatedAt: Timestamp!, $name: String!, $active: Boolean!, $code: String!, $address: String!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    operationReceipt(key: {actorUid: $actorUid, requestId: $requestId})
      @check(expr: "this == null", message: "CATALOGUE_REQUEST_APPLIED") { operation }
  }
  branch_updateMany(
    where: {id: {eq: $id}, legacyId: {eq: $legacyId}, updatedAt: {eq: $expectedUpdatedAt}},
    data: { name: $name, active: $active, code: $code, address: $address, timezone: "Asia/Kolkata", updatedAt_expr: "request.time"}
  ) @check(expr: "this == 1", message: "CATALOGUE_VERSION_CHANGED")

  auditLog_insert(data: {actorUid: $actorUid, actorRole: "admin", action: "booking_catalog_branch_saved", resourceType: "catalogue_branch", resourceId: $legacyId})
  operationReceipt_insert(data: {actorUid: $actorUid, requestId: $requestId, operation: $operation})
}

