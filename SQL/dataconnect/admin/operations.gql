# IAM only; no browser user (including a staff claim) may execute these.
query CheckSqlFoundation @auth(level: NO_ACCESS) {
  clinicProfile(key: {id: "sood-clinic"}) { id name timezone }
}

# Trusted migration uses existing published contact data, never patient fixtures.
mutation ImportPublicClinicContact($name: String!, $phone: String!, $email: String!, $address: String!, $timezone: String!)
@auth(level: NO_ACCESS) @transaction {
  clinicProfile_upsert(data: {
    id: "sood-clinic", name: $name, phone: $phone, email: $email,
    address: $address, timezone: $timezone, updatedAt_expr: "request.time"
  })
  auditLog_insert(data: {actorRole: "system", action: "public_contact_imported", resourceType: "clinic_profile", resourceId: "sood-clinic"})
}

