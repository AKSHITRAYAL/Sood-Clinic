# Release every unit held by one appointment (cancel/reschedule/move paths).
mutation ReleaseAppointmentUnits(
  $actorUid: String!, $actorRole: String!, $appointmentId: UUID!, $doctorLegacyId: String!,
  $requestId: UUID!, $operation: String!, $auditAction: String!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    receipt: operationReceipt(key: {actorUid: $actorUid, requestId: $requestId})
      @check(expr: "this == null", message: "SCHEDULER_REQUEST_APPLIED") { operation }
  }
  user_updateMany(where: {id: {eq: $actorUid}, active: {eq: true}}, data: {active: true})
    @check(expr: "this == 1", message: "SCHEDULER_ACCOUNT_UNAVAILABLE")
  appointmentUnit_deleteMany(where: {appointmentId: {eq: $appointmentId}})
  auditLog_insert(data: {actorUid: $actorUid, actorRole: $actorRole, action: $auditAction, resourceType: "appointment_unit", resourceId: $doctorLegacyId})
  operationReceipt_insert(data: {actorUid: $actorUid, requestId: $requestId, operation: $operation})
}

# releaseHold deletes only this doctor's units carrying this hold hash.
mutation ReleaseHoldUnits(
  $actorUid: String!, $actorRole: String!, $doctorId: UUID!, $doctorLegacyId: String!,
  $holdHash: String!, $requestId: UUID!, $operation: String!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    receipt: operationReceipt(key: {actorUid: $actorUid, requestId: $requestId})
      @check(expr: "this == null", message: "SCHEDULER_REQUEST_APPLIED") { operation }
  }
  user_updateMany(where: {id: {eq: $actorUid}, active: {eq: true}}, data: {active: true})
    @check(expr: "this == 1", message: "SCHEDULER_ACCOUNT_UNAVAILABLE")
  appointmentUnit_deleteMany(where: {_and: [{doctorId: {eq: $doctorId}}, {kind: {eq: "hold"}}, {holdHash: {eq: $holdHash}}]})
  auditLog_insert(data: {actorUid: $actorUid, actorRole: $actorRole, action: "hold_released", resourceType: "appointment_unit", resourceId: $doctorLegacyId})
  operationReceipt_insert(data: {actorUid: $actorUid, requestId: $requestId, operation: $operation})
}
