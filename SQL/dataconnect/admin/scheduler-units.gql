# Phase 6 draft (LOCAL ONLY): occupancy unit read/claim/release IAM operations.
# Callable wrappers arrive with the staged scheduler backends; no browser or
# public connector access before the coordinated release. Claims follow the
# protocol in SQL/phase 6.md: combined receipt + live-conflict query checks,
# then expired/own-hold cleanup, then bounded conditional inserts.

# One IST range pre-read for the claim handler: schedule state, sessions, the
# day's exception, overlapping blocks and every unit already in the range.
query ReadDoctorUnitRange($actorUid: String!, $doctorLegacyId: String!, $rangeStart: Timestamp!, $rangeEnd: Timestamp!, $exceptionDate: Date!)
@auth(level: NO_ACCESS) {
  user(key: {id: $actorUid}) { active }
  doctors(where: {legacyId: {eq: $doctorLegacyId}}, limit: 2) {
    id legacyId name active
    branch { timezone }
    state: doctorScheduleState_on_doctor { authority updatedAt }
    sessions: doctorSchedules_on_doctor(limit: 15, orderBy: [{weekday: ASC}, {startMinute: ASC}, {id: ASC}]) { weekday startMinute endMinute }
    exceptions: scheduleExceptions_on_doctor(where: {date: {eq: $exceptionDate}}, limit: 2) {
      id kind date updatedAt
      windows: exceptionWindows_on_exception(limit: 10, orderBy: [{startMinute: ASC}, {id: ASC}]) { startMinute endMinute }
    }
    blocks: calendarBlocks_on_doctor(where: {_and: [{startsAt: {lt: $rangeEnd}}, {endsAt: {gt: $rangeStart}}]}, orderBy: [{startsAt: ASC}], limit: 50) {
      id kind title startsAt endsAt allDay dateKeyStart dateKeyEnd
    }
    units: appointmentUnits_on_doctor(where: {_and: [{unitAt: {ge: $rangeStart}}, {unitAt: {lt: $rangeEnd}}]}, orderBy: [{unitAt: ASC}, {unitKey: ASC}], limit: 600) {
      unitKey unitAt kind appointmentId holdHash expiresAt
    }
  }
}

# Atomically claim aligned units for one hold or booking. $unitKeys/$unitAts/$kinds
# are handler-computed (never client input); $ownHoldHash excludes this caller's
# live hold so a hold converts without releasing first; $slot0..$slot95
# enable exactly the rows in the claimed range (bound documented in SQL/phase 6.md).
mutation ClaimAppointmentUnits(
  $actorUid: String!, $actorRole: String!, $doctorId: UUID!, $doctorLegacyId: String!,
  $requestId: UUID!, $operation: String!, $auditAction: String!,
  $now: Timestamp!, $ownHoldHash: String!,
  $unitKeys: [String!]!, $unitAts: [Timestamp!]!, $kinds: [String!]!,
  $appointmentId: UUID, $holdHash: String, $expiresAt: Timestamp,
  $slot0: Boolean!, $slot1: Boolean!, $slot2: Boolean!, $slot3: Boolean!, $slot4: Boolean!, $slot5: Boolean!, $slot6: Boolean!, $slot7: Boolean!, $slot8: Boolean!, $slot9: Boolean!, $slot10: Boolean!, $slot11: Boolean!, $slot12: Boolean!, $slot13: Boolean!, $slot14: Boolean!, $slot15: Boolean!, $slot16: Boolean!, $slot17: Boolean!, $slot18: Boolean!, $slot19: Boolean!, $slot20: Boolean!, $slot21: Boolean!, $slot22: Boolean!, $slot23: Boolean!, $slot24: Boolean!, $slot25: Boolean!, $slot26: Boolean!, $slot27: Boolean!, $slot28: Boolean!, $slot29: Boolean!, $slot30: Boolean!, $slot31: Boolean!, $slot32: Boolean!, $slot33: Boolean!, $slot34: Boolean!, $slot35: Boolean!, $slot36: Boolean!, $slot37: Boolean!, $slot38: Boolean!, $slot39: Boolean!, $slot40: Boolean!, $slot41: Boolean!, $slot42: Boolean!, $slot43: Boolean!, $slot44: Boolean!, $slot45: Boolean!, $slot46: Boolean!, $slot47: Boolean!, $slot48: Boolean!, $slot49: Boolean!, $slot50: Boolean!, $slot51: Boolean!, $slot52: Boolean!, $slot53: Boolean!, $slot54: Boolean!, $slot55: Boolean!, $slot56: Boolean!, $slot57: Boolean!, $slot58: Boolean!, $slot59: Boolean!, $slot60: Boolean!, $slot61: Boolean!, $slot62: Boolean!, $slot63: Boolean!, $slot64: Boolean!, $slot65: Boolean!, $slot66: Boolean!, $slot67: Boolean!, $slot68: Boolean!, $slot69: Boolean!, $slot70: Boolean!, $slot71: Boolean!, $slot72: Boolean!, $slot73: Boolean!, $slot74: Boolean!, $slot75: Boolean!, $slot76: Boolean!, $slot77: Boolean!, $slot78: Boolean!, $slot79: Boolean!, $slot80: Boolean!, $slot81: Boolean!, $slot82: Boolean!, $slot83: Boolean!, $slot84: Boolean!, $slot85: Boolean!, $slot86: Boolean!, $slot87: Boolean!, $slot88: Boolean!, $slot89: Boolean!, $slot90: Boolean!, $slot91: Boolean!, $slot92: Boolean!, $slot93: Boolean!, $slot94: Boolean!, $slot95: Boolean!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    receipt: operationReceipt(key: {actorUid: $actorUid, requestId: $requestId})
      @check(expr: "this == null", message: "SCHEDULER_REQUEST_APPLIED") { operation }
    conflicts: appointmentUnits(
      where: {_and: [{unitKey: {in: $unitKeys}}, {_or: [{kind: {ne: "hold"}}, {_and: [{expiresAt: {ge: $now}}, {holdHash: {ne: $ownHoldHash}}]}]}]}
    ) @check(expr: "this.size() == 0", message: "SCHEDULER_SLOT_TAKEN") { unitKey }
  }
  user_updateMany(where: {id: {eq: $actorUid}, active: {eq: true}}, data: {active: true})
    @check(expr: "this == 1", message: "SCHEDULER_ACCOUNT_UNAVAILABLE")
  # Reclaim expired holds and drop this caller's own hold rows in one statement
  # (the compiler rejects selecting the same mutation field twice).
  appointmentUnit_deleteMany(where: {_and: [{unitKey: {in: $unitKeys}}, {kind: {eq: "hold"}}, {_or: [{expiresAt: {lt: $now}}, {holdHash: {eq: $ownHoldHash}}]}]})
  u0: appointmentUnit_insert(data: {unitKey_expr: "vars.unitKeys[0]", doctorId: $doctorId, unitAt_expr: "vars.unitAts[0]", kind_expr: "vars.kinds[0]", appointmentId: $appointmentId, holdHash: $holdHash, expiresAt: $expiresAt}) @include(if: $slot0)
